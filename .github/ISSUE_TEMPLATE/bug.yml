name: Bug report
description: Report a bug
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - fly-vision
        - honey-factory
        - repo / tooling
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: Observed and expected behaviour
      description: Describe the action, its result and the result you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, package version; for the mod, Minecraft / Fabric / Java versions.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
