name: Research question
description: Investigate fly biology or modelling assumptions
labels: [research]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: State the question to investigate.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Name the decision or implementation that needs this answer.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Known sources
      description: Link papers, datasets such as FlyWire, or related work.
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Specify the deliverable, such as science notes, an ADR or a parameter table.
