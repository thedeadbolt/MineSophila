name: Research question
description: An open question about fly biology, modelling, or approach
labels: [research]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do we need to find out?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Why it matters
      description: What decision or implementation depends on the answer?
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Known sources
      description: Papers, datasets (e.g. FlyWire), prior art.
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: e.g. a section in docs/science/, an ADR, or a parameter table.
