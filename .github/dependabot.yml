version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: gradle
    directory: /packages/honey-factory
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    # Minecraft, Fabric Loader, Loom and Fabric API must move together, by hand.
    ignore:
      - dependency-name: "com.mojang*"
      - dependency-name: "net.fabricmc*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
