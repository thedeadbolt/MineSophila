# Check the PR title before using it as the squash commit message on main.
# release-please reads these Conventional Commit messages.
name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scopes: |
            fly-vision
            honey-factory
            honey-factory-tools
            docs
            repo
            deps
            ci
            tests
          requireScope: false
