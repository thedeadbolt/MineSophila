# PRs are squash-merged, so the PR title becomes the commit on main that
# release-please reads. Enforce Conventional Commits on it.
name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scopes: |
            fly-vision
            honey-factory
            docs
            repo
            deps
            ci
            tests
          requireScope: false
