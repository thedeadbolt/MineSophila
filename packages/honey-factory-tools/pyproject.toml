[project]
name = "honey-factory-tools"
version = "0.0.0"
description = "Validate and inspect honey-factory datasets outside Minecraft."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "João Moutinho" }]
dependencies = [
    "fly-vision",
    "jsonschema>=4.23",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
]

[tool.uv.sources]
fly-vision = { workspace = true }

[project.scripts]
honey-factory-tools = "honey_factory_tools.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"
