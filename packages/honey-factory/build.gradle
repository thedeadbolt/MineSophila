plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = file('version.txt').text.trim()

sourceSets {
	test {
		java.setSrcDirs(['../../tests/honey-factory/java'])
		resources.setSrcDirs(['../../tests/honey-factory/resources'])
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"honey_factory" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Client game tests launch Minecraft, so `build` does not run them; use runClientGameTest.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "honey_factory_gametest"
		enableGameTests = false
		enableClientGameTests = true
	}
}

// Game tests read golden masks and write review output under the repository.
loom {
	runs {
		clientGameTest {
			property("honeyfactory.repoRoot", file('../..').canonicalPath)
			property("honeyfactory.regenerateGolden", providers.systemProperty("honeyfactory.regenerateGolden").getOrElse("false"))
			// Comma-separated test name prefixes, such as M6; empty runs every test.
			property("honeyfactory.gametests", providers.systemProperty("honeyfactory.gametests").getOrElse(""))
			// Where the M9 acceptance runs write, and the label of this run's folder; empty uses the defaults.
			property("honeyfactory.acceptanceRoot", providers.systemProperty("honeyfactory.acceptanceRoot").getOrElse(""))
			property("honeyfactory.acceptanceLabel", providers.systemProperty("honeyfactory.acceptanceLabel").getOrElse(""))
			// Where the production runner writes and which of its datasets it runs; empty uses the defaults and runs all.
			property("honeyfactory.productionRoot", providers.systemProperty("honeyfactory.productionRoot").getOrElse(""))
			property("honeyfactory.productionRuns", providers.systemProperty("honeyfactory.productionRuns").getOrElse(""))
		}
	}
}

sourceSets {
	gametest {
		java.setSrcDirs(['../../tests/honey-factory/gametest/java'])
		resources.setSrcDirs(['../../tests/honey-factory/gametest/resources'])
	}
}

dependencies {
	// Set dependency versions in gradle.properties.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// The Git state recorded in every dataset manifest's software section.
def gitCommit = providers.exec {
	commandLine 'git', 'rev-parse', 'HEAD'
	ignoreExitValue = true
}.standardOutput.asText.map { it.trim() }
def gitDirty = providers.exec {
	commandLine 'git', 'status', '--porcelain'
	ignoreExitValue = true
}.standardOutput.asText.map { !it.trim().isEmpty() }
def buildInfo = tasks.register('buildInfo') {
	def output = layout.buildDirectory.dir('generated/build-info')
	def commit = gitCommit
	def dirty = gitDirty
	inputs.property('gitCommit', commit)
	inputs.property('gitDirty', dirty)
	outputs.dir(output)
	doLast {
		def file = output.get().file('honey_factory/build-info.json').asFile
		file.parentFile.mkdirs()
		def hash = commit.get() ==~ /[0-9a-f]{40}/ ? "\"${commit.get()}\"" : 'null'
		file.text = "{\"git_commit\": ${hash}, \"git_dirty\": ${dirty.get()}}\n"
	}
}
sourceSets.main.resources.srcDir(buildInfo)

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

test {
	useJUnitPlatform()

	// Contract tests read the language-neutral schemas and shared fixtures.
	def repoRoot = file('../..').canonicalPath
	inputs.dir("${repoRoot}/schemas/honey-factory").withPropertyName("contractSchemas")
	inputs.dir("${repoRoot}/tests/integration/fixtures/honey-factory").withPropertyName("contractFixtures")
	systemProperty "honeyfactory.repoRoot", repoRoot
	systemProperty "honeyfactory.regenerateFixtures", providers.systemProperty("honeyfactory.regenerateFixtures").getOrElse("false")
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("../../LICENSE") {
		rename { "${it}_$projectName" }
	}
}
