# Configure the Python workspace, development tools and tests here.
# package = false keeps this root project out of distribution builds.
[project]
name = "minesophila"
version = "0.0.0"
description = "Drosophila vision for Minecraft: find honey blocks through a fly's eyes."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
# List Python workspace members here so root `uv sync` installs them for integration tests.
dependencies = ["fly-vision"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
# Build honey-factory with Gradle outside this Python workspace.
members = ["packages/fly-vision"]

[tool.uv.sources]
fly-vision = { workspace = true }

# pytest: settings for package, integration and e2e tests
[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib", "-m", "not minecraft"]
markers = [
    "integration: checks workspace installation or interactions between packages",
    "e2e: full product run",
    "minecraft: needs a running Minecraft instance (deselected by default; run with -m minecraft)",
]
xfail_strict = true

# Ruff: repository-wide Python lint and formatting
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["packages/honey-factory"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "N", "C4", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["fly_vision"]

# Pyright: strict type checking
[tool.pyright]
include = ["packages/fly-vision/src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.coverage.run]
branch = true
